[project]
name = "seo-toolkit"
version = "0.1.0"
description = "Python scripts for SEO data analysis and planning"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Data
    "pandas>=2.2",
    "pyarrow>=17.0",
    "openpyxl>=3.1",
    "numpy>=1.26",
    # Google APIs
    "google-api-python-client>=2.140",
    "google-auth>=2.34",
    "google-analytics-data>=0.18",
    "gspread>=6.1",
    # HTTP, crawling, parsing
    "httpx>=0.27",
    "tenacity>=9.0",
    "selectolax>=0.3.21",
    "advertools>=0.16",
    "tldextract>=5.1",
    # Analysis
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    # Visualization
    "plotly>=5.24",
    "matplotlib>=3.9",
    # CLI, config, utils
    "typer>=0.12",
    "rich>=13.8",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Semantic keyword clustering (pulls in PyTorch, ~2GB)
semantic = ["sentence-transformers>=3.1"]
# LLM-assisted intent classification / cluster labelling
llm = ["anthropic>=0.40"]
# Fast processing of very large exports
polars = ["polars>=1.9"]

[project.scripts]
seo = "seo_toolkit.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "pre-commit>=3.8",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seo_toolkit"]

# --- Ruff ----------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "PD",      # pandas-vet
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401"]

# --- Pytest --------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: tests that hit real APIs or the internet (deselect with -m 'not network')",
]

# --- Mypy ----------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
