# Alembic settings for creating new migrations by hand:
#   uv run alembic revision --autogenerate -m "add sites table"
# The database URL comes from DATABASE_URL in .env (see migrations/env.py).
# Applying migrations is simpler with: uv run seo db setup

[alembic]
script_location = src/seo_toolkit/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
